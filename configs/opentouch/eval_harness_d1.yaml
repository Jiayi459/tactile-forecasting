# GENERATED by scripts/opentouch_apply_baseline.py -- identical to
# configs/opentouch/eval_harness.yaml except states_root, which points at the D1-corrected cache
# (k=1.0). The hash therefore differs from the raw harness, which is the
# point: it is a different protocol instance, not the same one re-run.
# Frozen evaluation harness for OpenTouch (single right-hand FPC glove, 16x16, 30 Hz).
# Structurally mirrors configs/actionsense/eval_harness.yaml; every value below is either
# forced by the sensor (single hand) or independently re-derived from OpenTouch's own
# measurements (never copied from the ActionSense numbers). See SESSION_LOG 2026-08-06..10
# for the derivation of each field. Loaded by src/opentouch/*, NOT by src/actionsense/*.

target:
  # 3-dim RAW target, right hand only (OpenTouch instruments ONLY the right hand --
  # arXiv:2512.16842: "We instrument only the right dominant hand to simplify hardware
  # and standardize annotations"). RAW = the physical moments straight from state_N.npy,
  # NO high-pass, NO warmup cut.
  channels: [F_R, CoPx_R, CoPy_R]
  force_idx: [0]        # total-force channel (never masked)
  cop_idx:   [1, 2]      # CoP channels (masked at low force)

rate:
  fps_raw: 30.0           # measured median 30.01 Hz across every shard (2026-08-10 run)
  downsample: 1            # native rate used as-is -- NOT upsampled like ActionSense was
  horizon_s: 1.0            # forecast look-ahead. At 30 Hz => 30 steps.

mask:
  # Same definition as ActionSense: a CoP TARGET frame is excluded from CoP metrics iff
  # that hand's RAW total force < the TRAIN 5th percentile. Force channels never masked.
  percentile: 5

baselines:
  # Fit scope: OBJECT_CATEGORY, NOT action x object -- OpenTouch's rare actions (e.g.
  # stirring n=5) don't have enough windows to fit AR(90) per group. NOTE (corrected
  # 2026-08-10): object_category is itself long-tailed (110 distinct values, not the
  # small clean set assumed when this was first chosen) -- see min_group_size below.
  # Interpreted by src/opentouch/dataset.py::group_keys (not the ActionSense parser).
  fit_scope: object_category
  # object_category has 110 distinct values, badly long-tailed (measured 2026-08-10:
  # 81/110 have n<30, 39 have n<10, several are n=1). Any category with fewer than this
  # many clips CORPUS-WIDE is merged into a single "other" group rather than fit alone
  # (OQ-I). At 30: 29 categories kept individually (68% of the corpus), other=32%.
  # Configurable -- not a structural constant. See src/opentouch/dataset.py::group_keys.
  min_group_size: 30
  # ActionSense orders [2,5,10,15,20,30] @ 10 Hz = 0.2..3.0 s. Same PHYSICAL seconds,
  # re-expressed in 30 Hz frames (this corpus is native 30 Hz, not downsampled).
  ar_orders: [6, 15, 30, 45, 60, 90]
  seasonal_period_min_s: 0.3   # kept identical to ActionSense: a prior about human hand
  seasonal_period_max_s: 3.0   # motion-cycle timescales, not about sensor geometry
  seasonal_min_autocorr: 0.1

split:
  # PLACEHOLDER -- NOT YET FUNCTIONAL. Blocked: whether the "_p1"/"_p2" shard suffix
  # denotes participant or recording session is unresolved (paper and repo silent;
  # indirect evidence from object-name overlap and cross-environment leakage within a
  # shard is consistent with both readings). src/opentouch/splits.py does not exist yet.
  # DO NOT wire this into evaluate.py until that question is resolved.
  train: 0.6
  val: 0.2
  test: 0.2
  seed: 0

eval:
  stride: 1
  min_history: 15    # 0.5 s @ 30 Hz -> 45-frame floor incl. 1 s horizon; covers 96% of clips
  seed: 0

paths:
  states_root: /users/jhao3/opentouch/cache_d1
  split_file: /users/jhao3/opentouch/cache_d1/splits.json     # inert until splits.py exists
  out_csv: docs/harness_baselines_opentouch.csv

# Empty = no filter. Train on the full corpus (all ~2,958 clips), not just the n>=30 actions --
# rare actions still contribute valid training signal even though they can't be evaluated
# individually (SESSION_LOG 2026-08-07/09).
actions: []

# Historical offline protocol. For causal reruns use eval_harness.yaml on RAW maps.
calibration:
  mode: legacy
